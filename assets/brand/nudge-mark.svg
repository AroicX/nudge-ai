<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Nudge mark</title>
  <desc id="desc">A colorful continuous n gesture rising into a clicked arrow on a midnight rounded square.</desc>
